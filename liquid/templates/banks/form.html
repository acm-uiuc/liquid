{% extends "base.html" %}

{% block content %}
<header class="page-header">
<h1>{{ page_title }}</h1>
</header>
<form class="well" method="POST">
  {% csrf_token %}
  {{ form }}
  <div class="control-group">
    <div class="controls">
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </div>
</form>
{% endblock %}
